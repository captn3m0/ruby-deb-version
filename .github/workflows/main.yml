name: CI
on:
  push:
permissions: {}
jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{matrix.os}}
    name: Ruby ${{ matrix.ruby }} @ ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.1', '3.2', jruby, truffleruby, '3.3', '3.4', '4.0']
        exclude:
        - os: windows-latest
          ruby: truffleruby
        - os: windows-latest
          ruby: jruby
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run tests
      run: bundle exec rake test
    - name: Run rubocop
      run: bundle exec rake rubocop
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'captn3m0/ruby-deb-version'}}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    name: Release Gem
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "3.4"
      - name: Install dependencies
        run: bundle install
      - uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1.5.0
